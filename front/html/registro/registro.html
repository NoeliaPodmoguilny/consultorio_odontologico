<!DOCTYPE html>

<html>

<head>
    <title>TOOTH | Registro</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap icons-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet" />
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <!-- Estilos bootstrap y propios -->
    <link href="/css/style.css" rel="stylesheet" />
</head>

<body class="bg-body-image d-flex align-items-center justify-content-center">
    <!-- Contact section-->

    <div class="container ">
        <div class="row justify-content-center">
            <div class="col-lg-6 ">

                <!-- Texto de bienvenida y descripción -->
                <div class="text-center ">
                    <img class="img-fluid w-50" src="/assets/logoToot.png" alt="Logo consultorio Tooth" />
                </div>
                <div class="px-0">
                    <p class="fs-3 fw-bolder text-start">Bienvenido/a</p>
                    <p class="fs-5 text-start">Ingrese sus datos para registrarse</p>
                </div>

                <!-- FORMULARIO -->
                <form id="registroForm" data-sb-form-api-token="API_TOKEN" >

                    <!-- ROLES, opciones admin y odonto sólo para usuario admin -->
                    <div class="row animate__animated  animate__zoomIn">
                        <div class=" my-1">
                            <select class="form-select" name="roles" id="rol">
                                <option disabled selected >Rol</option>
                                <option id="admin" value="ADMIN">Recepcionista</option>
                                <option id="odontologo" value="ODONTOLOGO">Odontólogo</option>
                                <option value="PACIENTE">Paciente</option>
                            </select>
                        </div>
                        <div class="col-md-6 my-1" id="tratamientos-container" style="display: none;">
                            <label for="tratamientos" class="h6">Selecciona 1 o varios tratamientos (ctrl+click)</label>
                            <select id="tratamientos" class="form-select" multiple aria-label="Multiple select">
                            </select>
                        </div>


                        <!-- Resto de inputs -->
                        <div class="my-1">
                            <label class="h6">Fecha de nacimiento</label>
                            <input class="form-control" type="date" id="fechaNacimiento" name="fechaNacimiento">
                            <span></span>
                        </div>

                        <div class="my-1">
                            <input class="form-control" id="username" name="username" placeholder="USERNAME">
                            <span></span>
                        </div>

                        <div class="col-md-6 my-1">
                            <input class="form-control" id="nombre" name="nombre" placeholder="NOMBRE">
                            <span></span>
                        </div>

                        <div class="col-md-6 my-1">
                            <input class="form-control" id="apellido" name="apellido" placeholder="APELLIDO">
                            <span></span>
                        </div>

                        <div class="col-md-6 my-1">
                            <input class="form-control" id="dni" name="dni" placeholder="DOCUMENTO">
                            <span></span>
                        </div>

                        <div class="col-md-6 my-1">
                            <input required class="form-control" id="telefono" name="telefono" placeholder="TELÉFONO">
                            <span></span>
                        </div>

                        <div class="col-md-6 my-1">
                            <input type="email" required class="form-control" id="correoElectronico" name="correoElectronico"
                                placeholder="CORREO ELECTRÓNICO">
                            <span></span>
                        </div>

                        <div class="col-md-6 my-1">
                            <input type="password" required minlength="8" maxlength="16" class="form-control"
                                id="contrasenia" name="contrasenia" placeholder="CONTRASEÑA">
                            <span></span>
                        </div>
                    </div>

                    <!-- Botones de acción -->
                    <div class="d-grid my-1 animate__animated  animate__zoomIn">
                        <button class="btn-lightblue btn-lg w-100" id="btnRegistro" type="submit">Crear cuenta</button>
                    </div>
                    <div class="d-grid my-2 animate__animated  animate__zoomIn">
                        <button class="btn btn-light text-info btn-lg opacity-75 w-100" id="btnIngreso" type="button"><a
                                class="text-decoration-none text-dark" href="/html/ingreso/ingreso.html">Ya tengo una
                                cuenta</a></button>
                        <button type="button" class="btn btn-link text-decoration-none w-100 opacity-75"><a
                                class="text-decoration-none text-dark" href="/index.html"> <i
                                    class="bi bi-arrow-left-circle fs-3"></i> </a> </button>

                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="/js/registro/registro.js"></script>
    <script src="/js/validaciones/validaFormRegistro.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>



</body>

</html>
