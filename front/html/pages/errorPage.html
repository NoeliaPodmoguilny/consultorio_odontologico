<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOOTH | Error Page</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #fbf8f8;
            color: #202930;
            font-family: Arial, sans-serif;
        }

        .error-container {
            text-align: center;
        }

        .error-code {
            font-size: 72px;
            font-weight: bold;
        }

        .error-message {
            font-size: 24px;
        }

        .home-link {
            margin-top: 20px;
            display: inline-block;
            padding: 10px 20px;
            background-color: #c6e3f5;
            color: #202930;
            text-decoration: none;
            border-radius: 5px;
        }

        .home-link:hover {
            background-color: #a8d3e9;
        }
    </style>
</head>

<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <div class="error-message">Page Not Found</div>
        <a href="/" class="home-link">Ir al inicio</a>
    </div>
</body>

</html>
