<!DOCTYPE html>
<html lang="es">

<head>
    <title>TOOTH | Registro de tratamientos</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <!-- Estilos Bootstrap y propios -->
    <link href="/css/style.css" rel="stylesheet">
</head>

<body class="bg-body-image d-flex align-items-center justify-content-center">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6">

                <!-- Texto de bienvenida -->
                <div class="text-center">
                    <img class="img-fluid w-50" src="/assets/logoToot.png" alt="Logo consultorio Tooth">
                </div>
                <div class="px-0">
                    <p class="fs-3 fw-bolder text-start">Bienvenido/a</p>
                    <p class="fs-5 text-start">Ingrese datos del nuevo tratamiento</p>
                </div>

                <!-- FORMULARIO -->
                <form id="registroForm">
                    <div class="row animate__animated animate__zoomIn">

                        <div class="my-1">
                            <input class="form-control" id="tipoTratamiento" name="tipoTratamiento" placeholder="TRATAMIENTO" required>
                        </div>

                        <div class=" my-1">
                            <input class="form-control" id="descripcion" name="descripcion" placeholder="BREVE DESCRIPCIÓN" required>
                        </div>

                        <!-- Botón de acción -->
                        <div class="d-grid my-1 animate__animated animate__zoomIn">
                            <button class="btn-lightblue btn-lg w-100" id="btnRegistro" type="button">Guardar</button>
                        </div>

                        <!-- Botón para volver -->
                        <div class="d-grid my-2 animate__animated animate__zoomIn">
                            <a class="btn btn-link text-decoration-none w-100 opacity-75 text-dark" href="/html/info/recepcionista/gestion.html">
                                <i class="bi bi-arrow-left-circle fs-3"></i>
                            </a>
                        </div>

                    </div>
                </form>

            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/js/registro/registro.js" defer></script>
    <script src="/js/info/recepcionista/registroTratamiento.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


</body>
</html>
