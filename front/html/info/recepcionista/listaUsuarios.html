<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOOTH | Lista de Usuarios</title>
  <!-- Bootstrap icons-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet" />
  <!-- Animate.css -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
  <!-- Estilos bootstrap y propios -->
  <link href="/css/style.css" rel="stylesheet" />
</head>
<body>
  <div class="container mt-5">
    <h2 class="text-center mb-4 animate__animated animate__zoomIn">Lista de Usuarios</h2>
    
    <!-- Botones para seleccionar el rol -->
    <div class="text-center mb-4 animate__animated animate__zoomIn">
      <button class="btn-pink" id="btnOdontologo">Odontólogos</button>
      <button class="btn-lightblue" id="btnRecepcionista">Recepcionistas</button>
      <button class="btn-pink" id="btnPaciente">Pacientes</button>
    </div>

    <!-- Tabla para mostrar usuarios -->
    <table class="table table-striped table-hover animate__animated animate__zoomIn">
      <thead class="table-info">
        <tr>
          <th>#</th>
          <th>Nombre</th>
          <th>Apellido</th>
          <th>DNI</th>
          <th>Rol</th>
          <th>Fecha de nacimiento</th>
          <th>Email</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="user-list" class="animate__animated animate__zoomIn">
        <!-- Las filas de usuarios se renderizarán aquí -->
      </tbody>
    </table>
    <div class="animate__animated animate__zoomIn">
      <a class="text-decoration-none btn-lightblue text-black" href="/html/info/recepcionista/gestion.html">Volver</a>
    </div>
    <!-- Formulario de edición de usuario -->
    <div id="edit-modal" class="modal animate__animated animate__fadeIn">
        <div class="modal-content">
            <span class="m-3" onclick="cerrarFormulario()"><i class="bi bi-x-circle"></i></span>
            <h2 class="mx-3">Editar Usuario</h2>
            <form id="edit-form">
                <div class="m-3">
                    <label for="edit-nombre" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="edit-nombre" required>
                </div>
                <div class="m-3">
                    <label for="edit-apellido" class="form-label">Apellido</label>
                    <input type="text" class="form-control" id="edit-apellido" required>
                </div>
                <div class="m-3">
                    <label for="edit-email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="edit-email" required>
                </div>
                <div class="m-3">
                    <label for="edit-fechaNacimiento" class="form-label">Fecha de Nacimiento</label>
                    <input type="date" class="form-control" id="edit-fechaNacimiento" required>
                </div>
                <input type="hidden" id="edit-dni">
                <button type="submit" id="btnEditar" class="btn btn-info m-3">Guardar Cambios</button>
            </form>
        </div>
    </div>

  </div>

  <!-- Bootstrap JS and Popper.js -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Archivo JS externo -->
  <script src="/js/info/recepcionista/listaUsuarios.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>
</html>
