<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOOTH | Calendario de turnos</title>

    <!-- Bootstrap icons-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet" />
    <!--estilos css bootstrap y propios-->
    <link href="/css/style.css" rel="stylesheet" />

    <!-- Estilos FullCalendar -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet" />

    <!-- Estilos animación -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
</head>

<body>
    <button type="button" class="btn btn-link text-decoration-none w-100 opacity-75 animate__animated  animate__zoomIn">
        <a class="text-decoration-none btn-lightblue text-black" href="/html/info/odontologosPages/odontologosIndex.html">Volver</a>
    </button>

    <div class="container-fluid">
        <div class="row ">
            <!-- Calendario -->
            <div class="col-md-6 p-4 ">
                <div id="calendar"></div>
            </div>

            <!-- Detalles del turno seleccionado -->
            <div class="col-md-3 bg-pink p-3 fs-6 animate__animated  animate__zoomIn mt-5" id="turno-details">
                <h3>Detalles del turno</h3>
                <p><strong>Nombre:</strong> <span id="detalle-nombre"></span></p>
                <p><strong>Apellido:</strong> <span id="detalle-apellido"></span></p>
                <p><strong>DNI:</strong> <span id="detalle-dni"></span></p>
                <p><strong>Email:</strong> <span id="detalle-email"></span></p>
                <p><strong>Teléfono:</strong> <span id="detalle-telefono"></span></p>
                <p><strong>Tratamiento:</strong> <span id="detalle-tratamiento"></span></p>
                <p><strong>Odontólogo:</strong> <span id="detalle-odontologo"></span></p>
                <p><strong>Día:</strong> <span id="detalle-dia"></span></p>
                <p><strong>Hora:</strong> <span id="detalle-hora"></span></p>
                <p><strong>Estado:</strong> <span id="detalle-estado"></span></p>

            </div>
        </div>
    </div>

    <!-- FullCalendar scripts -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.18.1/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>

    <!-- archivo js -->
    <script src="/js/info/odontologo/calendarioTurnos.js"></script>

</body>

</html>
