<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOOTH | Lista de turnos del paciente</title>
    <!-- Bootstrap icons-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet" />
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <!-- Estilos bootstrap y propios -->
    <link href="/css/style.css" rel="stylesheet" />
</head>

<body>
    <div class="container mt-5">
        <h2 class="text-center mb-4 animate__animated animate__zoomIn">Lista de turnos reservados</h2>

        <!-- Tabla para mostrar usuarios -->
        <table class="table table-striped table-hover">
            <thead class="table-info animate__animated animate__zoomIn">
                <tr>
                    <th>#</th>
                    <th>Fecha</th>
                    <th>Hora</th>
                    <th>Odontólogo</th>
                    <th>Motivo de consulta</th>
                    <th>Estado</th>
                    <th>Confirmar/Eliminar</th>
                </tr>
            </thead>
            <tbody id="turnosList" class="animate__animated animate__zoomIn">
                <!-- Las filas de usuarios se renderizarán aquí -->
            </tbody>
        </table>
        <div class="animate__animated animate__zoomIn">
            <a class="text-decoration-none btn-lightblue text-black" href="/index.html">Volver al inicio</a>

        </div>

    </div>

    <!-- Bootstrap JS and Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Archivo JS externo -->
    <script src="/js/info/paciente/listaDeTurnosPorPaciente.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>

</html>
