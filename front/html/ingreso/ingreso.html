<!DOCTYPE html>

<html>

<head>
    <title>TOOTH | Ingreso</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap icons-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet" />
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <!-- Estilos bootstrap y propios -->
    <link href="/css/style.css" rel="stylesheet" />
</head>

<body>

    <div class="container-fluid h-100 px-0">
        <div class="row g-0 h-100">

            <!-- Columna izquierda -->
            <div class="col-lg-6 d-flex justify-content-center align-items-center bg-pink vh-100 ">
                <img class="img-fluid w-50 animate__animated  animate__zoomIn" src="/assets/logoToot.png" alt="Logo consultorio Tooth" />
            </div>

            <!-- Columna derecha -->
            <div class="col-lg-6  bg-lightblue p-4 vh-100 d-flex justify-content-center align-items-center ">
                <div class="w-75 mx-auto">
                    <h2 class="h4 fw-bolder mt-2 text-start animate__animated  animate__zoomIn">Bienvenido/a</h2>
                    <p class="fs-6 mt-2 text-start animate__animated  animate__zoomIn">Por favor, ingrese su usuario y contraseña</p>

                    <!-- Formulario -->
                    <form id="form">
                        <div class="mb-3 animate__animated  animate__zoomIn">
                            <input type="text" class="form-control" id="username" placeholder="USUARIO">
                            <span></span>
                        </div>
                        <div class="mb-3 animate__animated  animate__zoomIn">
                            <input type="password" class="form-control" id="contraseña" placeholder="CONTRASEÑA">
                            <span></span>
                        </div>
                        <button type="submit" id="btnIngreso" class="btn-pink w-100 mb-1 animate__animated  animate__zoomIn">Ingresar</button>

                        <button type="button" class="btn btn-link text-decoration-none w-100 opacity-75 animate__animated  animate__zoomIn"><a
                                class="text-decoration-none text-dark" href="/html/registro/registro.html">¿No tienes
                                cuenta? Registrate aquí</a> </button>
                        <button type="button" class="btn btn-link text-decoration-none w-100 opacity-75 animate__animated  animate__zoomIn"><a
                                class="text-decoration-none text-dark" href="/index.html"> <i
                                    class="bi bi-arrow-left-circle fs-3"></i> </a> </button>
                    </form>
                </div>
            </div>
        </div>
    </div>


</body>
<script src="/js/ingreso/ingresar.js"></script>
<script src="/js/validaciones/validaFormInicio.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


</html>
